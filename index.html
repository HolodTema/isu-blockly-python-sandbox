<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CodeChef</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cascadia+Code:ital,wght@0,200..700;1,200..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/fonts.css">
    <link rel="stylesheet" href="assets/css/header.css">
    <link rel="stylesheet" href="assets/css/code_workspace.css">
    <link rel="stylesheet" href="assets/css/code_mirror.css">
    <link rel="stylesheet" href="assets/css/toast.css">
    <link rel="stylesheet" href="assets/css/splash_screen.css">
    <link rel="stylesheet" href="assets/css/code_execution_status.css">
    <link rel="stylesheet" href="assets/css/code_output.css">

    <link rel="icon" href="assets/images/logo.png" type="image/png">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/blockly@11.2.0/dist/blockly.min.css">
</head>
<body>
<div id="header">
    <div id="header_left">
        <img id="full_logo" src="assets/images/full_logo.png" alt="">

        <img src="assets/images/ic_save_project.svg" alt="">
        <a class="font_powered_mclaren" id="button_save_project">Сохранить проект</a>

        <img src="assets/images/ic_open_project.svg" alt="">
        <a class="font_powered_mclaren" id="button_open_project">Открыть проект</a>
    </div>
    <div id="header_right">
        <img src="assets/images/ic_convert_to_code.svg" alt="">
        <a class="font_powered_mclaren" id="button_convert_to_code">Конвертировать в код</a>

        <img src="assets/images/ic_run_code.svg" alt="">
        <a class="font_powered_mclaren" id="button_run_code">Запуск</a>

        <img src="assets/images/ic_debug_code.svg" alt="">
        <a class="font_powered_mclaren" id="button_debug_code">Отладка</a>
        
        <img id="button_expand_code" src="assets/images/ic_expand_right.svg" alt="">
    </div>
</div>
<main>
    <div id="blockly_workspace"></div>
    <div id="code_workspace">
        <div id="input_files_toolbar">
            <input id="input_add_input_file" type="file" accept=".txt, .json, .csv"/>
            <img id="img_add_input_file" src="assets/images/ic_add_input_file.svg" alt="">
            <a id="button_add_input_file" class="font_powered_mclaren">Входные файлы</a>
            <div id="input_files_list">
<!--                <div class="input_file">-->
<!--                    <img class="button_remove_input_file" src="assets/images/ic_close_black.svg" alt="close">-->
<!--                    <div class="input_file_text">File name kdjjaskdfja</div>-->
<!--                </div>-->
            </div>
        </div>
        <div id="codeViewer">
            <div id="codemirror_workspace">
            </div>
        </div>
        <div id="code_output_header">
            <div id="code_output_header_left">
                <img id="button_expand_output" src="assets/images/ic_expand_down.svg" alt="expand">
                <div id="code_output_tab_bar">
                    <button class="tab_button active" data-tab="Output">Вывод</button>
                    <button class="tab_button" data-tab="OutputFiles">Итоговые файлы</button>
                </div>
            </div>
            <div id="code_output_header_right">
                <div id="code_execution_status">
                    <div id="code_execution_status_text" class="font_powered_mclaren"></div>
                    <div id="code_execution_status_progress_bar_container">
                        <div id="code_execution_status_progress_bar"></div>
                    </div>
                </div>
            </div>
        </div>
        <div id="code_output" class="font_powered_cascadia_code code_output_expanded">
            <div id="tab_content_Output" class="tab_content active">Запусти код и посмотри результат его работы здесь!
            </div>
            <div id="tab_content_OutputFiles" class="tab_content">
                <div id="output_files_list">

                </div>
                <div id="output_files_preview">

                </div>
            </div>
        </div>

    </div>
</main>
<div id="toast_container"></div>
<div id="splash_screen_container">
    <img id="img_logo_splash_screen" src="assets/images/logo.png" alt="">
    <img id="img_full_logo_splash_screen" src="assets/images/full_logo.png" alt="">
    <div id="text_loading" class="font_powered_mclaren">Загрузка...</div>
</div>
<!--<script src="https://cdn.jsdelivr.net/pyodide/v314.0.0/full/pyodide.js"></script>-->
<script type="module" src="/src/main.ts"></script>
</body>
</html>
