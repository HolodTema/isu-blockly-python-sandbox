name: Deploy to server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npx vite build

      - name: Deploy via rsync
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          rsync -avz --delete dist/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_PATH }}

      - name: Send Telegram notification
        if: always()                      # отправляем даже при ошибке
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            EMOJI="✅"
            STATUS="SUCCESS"
          else
            EMOJI="❌"
            STATUS="FAILED"
          fi
          MESSAGE="$EMOJI Deploy to server $STATUS%0A"
          MESSAGE+="Repo: ${{ github.repository }}%0A"
          MESSAGE+="Branch: ${{ github.ref_name }}%0A"
          MESSAGE+="Commit: ${{ github.sha }}%0A"
          MESSAGE+="Author: ${{ github.actor }}%0A"
          MESSAGE+="Time: $(date '+%Y-%m-%d %H:%M:%S') UTC%0A"
          MESSAGE+="Link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="$MESSAGE" \
            -d parse_mode=HTML
