name: Deploy to server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npx vite build

      - name: Deploy via rsync
        id: deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          rsync -avz --delete dist/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_PATH }}

  notify:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      # ---- Базовое уведомление о статусе (текст) ----
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_STATUS: ${{ needs.deploy.result }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          AUTHOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "⚠️ Telegram secrets not set, skipping notification"
            exit 0
          fi

          if [ "$DEPLOY_STATUS" == "success" ]; then
            EMOJI="✅"
            STATUS="SUCCESS"
          else
            EMOJI="❌"
            STATUS="FAILED"
          fi

          MESSAGE="$EMOJI Deploy to server $STATUS%0A"
          MESSAGE+="Repo: $REPO%0A"
          MESSAGE+="Branch: $BRANCH%0A"
          MESSAGE+="Commit: $COMMIT%0A"
          MESSAGE+="Author: $AUTHOR%0A"
          MESSAGE+="Time: $(date '+%Y-%m-%d %H:%M:%S') UTC%0A"
          MESSAGE+="Link: $SERVER_URL/$REPO/actions/runs/$RUN_ID"

          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="HTML"

      # ---- Скриншот сайта ----
      - name: Take screenshot and send to Telegram
        if: needs.deploy.result == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "⚠️ Telegram secrets not set, skipping screenshot"
            exit 0
          fi
          npm install puppeteer
          node -e "
          const puppeteer = require('puppeteer');
          (async () => {
            const browser = await puppeteer.launch({ headless: true, args: ['--no-sandbox'] });
            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 800 });
            await page.goto('$SITE_URL', { waitUntil: 'networkidle2', timeout: 10000 });
            await page.screenshot({ path: 'screenshot.png', fullPage: false });
            await browser.close();
          })();
          "
          curl -s -F photo=@screenshot.png "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendPhoto" \
            -F chat_id="$TELEGRAM_CHAT_ID" \
            -F caption="📸 Текущий вид сайта после деплоя"

      # ---- QR-код сайта ----
      - name: Generate QR code and send to Telegram
        if: needs.deploy.result == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          npm install qrcode
          node -e "
          const QRCode = require('qrcode');
          QRCode.toFile('qrcode.png', '$SITE_URL', { width: 300 }, (err) => {
            if (err) throw err;
          });
          "
          curl -s -F photo=@qrcode.png "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendPhoto" \
            -F chat_id="$TELEGRAM_CHAT_ID" \
            -F caption="📱 QR-код на сайт (отсканируй телефоном)"

      # ---- ИСПРАВЛЕННЫЙ: Lighthouse-отчёт (прямой вызов lighthouse) ----
      - name: Run Lighthouse and send results
        if: needs.deploy.result == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          # Устанавливаем Lighthouse
          npm install -g lighthouse

          # Запускаем аудит, сохраняем JSON-отчёт
          lighthouse $SITE_URL --output=json --output-path=report.json --chrome-flags="--headless"

          # Проверяем, что отчёт создался
          if [ -f report.json ]; then
            # Извлекаем баллы (производительность, доступность, SEO, Best Practices)
            SCORES=$(node -e "
              const report = require('./report.json');
              const categories = report.categories || {};
              const perf = categories.performance ? Math.round(categories.performance.score * 100) : '?';
              const acc = categories.accessibility ? Math.round(categories.accessibility.score * 100) : '?';
              const seo = categories.seo ? Math.round(categories.seo.score * 100) : '?';
              const best = categories['best-practices'] ? Math.round(categories['best-practices'].score * 100) : '?';
              console.log(\`⚡ Производительность: \${perf}%\n♿ Доступность: \${acc}%\n🔍 SEO: \${seo}%\n📐 Best Practices: \${best}%\`);
            ")
            MESSAGE="📊 Lighthouse отчёт для $SITE_URL%0A$SCORES"
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              -d text="$MESSAGE"
          else
            echo "Lighthouse не создал отчёт"
          fi
