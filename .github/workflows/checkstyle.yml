name: Checkstyle 
on:
  pull_request:
    branches: [ "dev/main" ]

jobs:
  checkstyle:
    runs-on: ubuntu-latest

    steps:
     uses: actions/checkout@v4

    -name: Setup Node
    uses: actions/setup-node@v4
    with:
          node-version: 22
          cache: npm

  -name: Install dependencies
        run: npm ci

  -name: Run ESLint
        run: npm run lint